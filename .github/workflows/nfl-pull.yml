name: NFL Data Pull

# Runs the NFL data layer on a runner (nflverse + ESPN live), writes
# nfl_snapshot.json, and commits it so the live site redeploys.
#
# Schedule (UTC — GitHub cron has no timezone; these land mid-morning ET
# through the season, a little later once clocks fall back in November):
#   Thu 13:00  — Thursday Night Football prep
#   Fri 15:00  — after Friday's final injury-report designations
#   Sun 13:00  — game-day morning (full main slate)
#   Sun 16:00  — catch inactives (~90 min before the 1pm ET kickoffs)
#   Mon 13:00  — Monday Night Football prep
on:
  workflow_dispatch:
    inputs:
      player_cap:
        description: "Max players to pull (0 or blank = full slate)"
        required: false
        default: "0"
  schedule:
    - cron: "0 13 * * 4"    # Thursday  ~9am ET
    - cron: "0 15 * * 5"    # Friday    ~11am ET
    - cron: "0 13 * * 0"    # Sunday    ~9am ET
    - cron: "0 16 * * 0"    # Sunday    ~12pm ET (inactives)
    - cron: "0 13 * * 1"    # Monday    ~9am ET

permissions:
  contents: write

jobs:
  nfl-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NFL data pull (force live, write snapshot)
        env:
          NFL_PLAYER_CAP: ${{ github.event.inputs.player_cap || '0' }}
        run: python nfl.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name  "diamond-bot"
          git config user.email "diamond-bot@users.noreply.github.com"
          git add -f nfl_snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "NFL snapshot refresh [skip ci]"
            git push
          fi

name: NBA Data Pull

# Refreshes the ESPN + bbref NBA data on a real runner (the only place those
# sources are reachable), writes nba_snapshot.json, and commits it so the live
# site redeploys with fresh numbers. Runs on a daily schedule and on demand.
on:
  workflow_dispatch:
    inputs:
      player_cap:
        description: "Max players to pull (0 or blank = full slate; set a small number to test fast)"
        required: false
        default: "0"
  schedule:
    # times are UTC. EDT = UTC-4, EST = UTC-5.
    - cron: "0 16 * * *"    # ~12:00pm ET — morning refresh: slate, stats, defense, injuries
    - cron: "0 22 * * *"    # ~6:00pm ET  — pre-tip sweep: catch late injuries/lineups

permissions:
  contents: write        # needed to commit the snapshot back

jobs:
  nba-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NBA data pull (force live, write snapshot)
        env:
          # manual runs can override; scheduled runs send nothing, so default to
          # full slate. `|| '0'` keeps it valid when the input is absent/blank.
          NBA_PLAYER_CAP: ${{ github.event.inputs.player_cap || '0' }}
        run: python nba.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name  "diamond-bot"
          git config user.email "diamond-bot@users.noreply.github.com"
          git add -f nba_snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "NBA snapshot refresh [skip ci]"
            git push
          fi
